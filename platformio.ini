; Elecrow CrowPanel Advance 4.3" — SKU DIS01943A, hardware V1.0
; ESP32-S3-WROOM-1: 16 MB quad flash + 8 MB octal PSRAM (uitgelezen met esptool)
; USB-C "USB-5V-IN" via CH340K (UART0), dus geen native USB-CDC.

[platformio]
; Build-uitvoer lokaal i.p.v. op de NAS (sneller, minder kleine bestanden over het netwerk)
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/ESP32

[env:crowpanel_advance_43_v10]
; Vastgepind: Arduino-ESP32 core 3.3.12
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; Flash: 16 MB QIO, PSRAM: OPI (= Elecrow "OPI PSRAM" in Arduino IDE)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Elecrow-instelling "Huge APP (3MB No OTA/1MB SPIFFS)"
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
