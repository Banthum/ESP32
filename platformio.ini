; Elecrow CrowPanel Advance 4.3" â€” SKU DIS01943A, hardware V1.0
; ESP32-S3-WROOM-1: 16 MB quad flash + 8 MB octal PSRAM (uitgelezen met esptool)
; USB-C "USB-5V-IN" via CH340K (UART0), dus geen native USB-CDC.

[platformio]
; Build-uitvoer lokaal i.p.v. op de NAS (sneller, minder kleine bestanden over het netwerk)
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/ESP32
default_envs = bringup

; Gedeelde boardconfig voor alle omgevingen
[env]
; Vastgepind: Arduino-ESP32 core 3.3.12
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; Flash: 16 MB QIO, PSRAM: OPI (= Elecrow "OPI PSRAM" in Arduino IDE)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; Elecrow-instelling "Huge APP (3MB No OTA/1MB SPIFFS)"
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; SeriÃ«le bring-up: chip/flash/PSRAM-check, geen display
[env:bringup]
build_src_filter = +<bringup/>

; Elecrow's officiÃ«le V1.0-voorbeeld "lesson-03 BigInch_LVGL", ongewijzigd
; (example/V1.0/example_code4.3 in Elecrow-RD/CrowPanel-Advance-4.3-HMI-...).
; Libraryversies = wat Elecrow in example/V1.0/example_code4.3/libraries meelevert
; (hun readme noemt lvgl 8.3.3, maar de meegeleverde lvgl is 8.3.11), behalve LovyanGFX:
; Elecrow's 1.1.16 compileert niet op core 3.3.x; 1.2.25 is wat Elecrow zelf gebruikt
; met core 3.3.8 in de V1.3-cursus (zelfde paneel).
[env:elecrow_lesson03]
build_src_filter = +<elecrow_lesson03/>
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I src/elecrow_lesson03
    ; Adafruit SSD1306 definieert anders een macro INVERSE die TCA9534.h breekt
    -DNO_ADAFRUIT_SSD1306_COLOR_COMPATIBILITY
lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.2.25
    ; Adafruit-libs worden alleen ge-#include't door de demo, niet gebruikt
    ; (Elecrow noemt GFX 1.11.0; die staat niet in de registry, 1.11.3 is de dichtstbijzijnde)
    adafruit/Adafruit GFX Library@1.11.3
    adafruit/Adafruit SSD1306@2.5.17
    ; I/O-expander op 0x18 (PCA9557 op de PCB, registercompatibel): backlight + GT911-reset
    hideakitai/TCA9534@0.1.1

; BMSmachine (port van github.com/Banthum/EMS) - zelfstandig. Batterij-aansturing in
; schaduw-modus (rekent, stuurt niets); echt aansturen = [env:ems_xip_live].
; LVGL 9.6 = de release die het dichtst bij de EMS-UI's 9.6.0-dev (lv_port_linux) ligt.
[env:ems]
build_src_filter = +<ems/>
; Breekt de build af als de schrijfkant van de batterij buiten #if EMS_BATTERY_CONTROL_LIVE staat.
extra_scripts = pre:tools/check_readonly.py
board_build.partitions = partitions_ems.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src/ems
    ; dashboard-ui (zelfde include-paden als de CMake-build op de Pi)
    -I src/ems/ui
    -I src/ems/ui/fonts
lib_deps =
    lvgl/lvgl@9.6.0
    lovyan03/LovyanGFX@1.2.25
    hideakitai/TCA9534@0.1.1
    ; SQLite voor storage.cpp (zelfde schema/SQL als dashboard/storage.py)
    siara-cc/Sqlite3Esp32@2.5

; Unit-tests van de rekenlogica op het board (port van de Python-tests):
;     pio test -e ems_test
[env:ems_test]
build_src_filter = +<ems/logic/> +<ems/core/timeutil.cpp>
test_build_src = yes
test_filter = test_ems_logic
build_flags =
    ${env.build_flags}
    -DUNITY_INCLUDE_DOUBLE
    -I src/ems

; Zelfde firmware als [env:ems], maar gebouwd met pioarduino (zelfde Arduino-
; core 3.3.12) zodat de ESP-IDF-instellingen aangepast kunnen worden: het
; RGB-paneel leest zijn beeld uit PSRAM, en flash-writes/instructie-fetches
; uit flash legden die bus steeds even stil (beeld schudt). Zie de Espressif
; FAQ "LCD - screen drift" (XIP from PSRAM, IRAM-safe RGB-ISR).
;     pio run -e ems_xip -t upload
[env:ems_xip]
extends = env:ems
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; PSRAM (en flash) op 120 MHz i.p.v. 80, zoals Elecrow's "ESP32S3_120M"-core:
; meer bandbreedte voor de RGB-DMA. Experimenteel volgens Espressif.
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    CONFIG_IDF_EXPERIMENTAL_FEATURES=y
    CONFIG_SPIRAM_SPEED_120M=y
    CONFIG_SPIRAM_SPEED_80M=n
    CONFIG_SPIRAM_SPEED=120
    CONFIG_ESPTOOLPY_FLASHFREQ_120M=y
    CONFIG_ESPTOOLPY_FLASHFREQ_80M=n

; Zelfde als ems_xip, maar STUURT de batterij echt aan (poll elke 10 s, zoals de
; Pi). Nooit tegelijk met een ander systeem dat de batterij aanstuurt.
;     powershell -File tools\build_xip.ps1 -Live -Flash usb
[env:ems_xip_live]
extends = env:ems_xip
build_flags =
    ${env:ems.build_flags}
    -DEMS_BATTERY_CONTROL_LIVE=1
